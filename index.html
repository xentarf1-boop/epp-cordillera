<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPP Cordillera</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EPP Cordillera">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg:#111827; --acc:#F5B301; --tx:#fff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:var(--bg); z-index:2; transition:opacity .3s; text-align:center; padding:24px; }
  #splash img { width:112px; height:112px; border-radius:24px; }
  #splash b { font-size:1.4rem; letter-spacing:.04em; }
  #splash small { opacity:.75; }
  .bar { width:160px; height:6px; border-radius:3px; background:#374151; overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:var(--acc); animation:mv 1.1s infinite ease-in-out; }
  @keyframes mv { 0%{transform:translateX(-100%)} 100%{transform:translateX(250%)} }
  .btn { background:var(--acc); color:#111; border:0; border-radius:12px; padding:14px 22px; font-size:1.05rem; font-weight:700; }
  #inst { position:fixed; left:12px; right:12px; bottom:12px; z-index:3; display:none; align-items:center; gap:10px; background:#1F2937; color:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #inst span { flex:1; font-size:.95rem; }
  #inst .x { background:none; border:0; color:#9CA3AF; font-size:1.4rem; }
</style>
</head>
<body>
<div id="splash" role="status">
  <img src="icons/icon-192.png" alt="">
  <b>EPP CORDILLERA</b>
  <div class="bar"><i></i></div>
  <small id="msg">Abriendo la app…</small>
</div>
<iframe id="app" title="EPP Bodega Cordillera" allow="clipboard-write; fullscreen"></iframe>
<div id="inst"><span id="inst-t">Instala la app en tu celular para abrirla con un toque.</span><button class="btn" id="inst-ok" type="button">Instalar</button><button class="x" id="inst-x" type="button" aria-label="Cerrar">×</button></div>
<script>
/* ===== Link de la app (Apps Script). Si algún día cambia, se cambia solo aquí. ===== */
const APP_URL = "https://script.google.com/macros/s/AKfycbzehRV9mRq1ZGuub5Mh6onXauC_BdESrdHYYiusDThaZRD6sIGLdtYbI4Y91poqfmcD/exec";

const fr = document.getElementById("app"), sp = document.getElementById("splash"), msg = document.getElementById("msg");
const listo = () => { sp.style.opacity = 0; setTimeout(() => sp.remove(), 350); };
if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) { msg.textContent = "Falta configurar el link de la app."; document.querySelector(".bar").remove(); }
else if (!navigator.onLine) { msg.innerHTML = "Sin internet. Conéctate y vuelve a intentar.<br><br><button class='btn' onclick='location.reload()'>Reintentar</button>"; document.querySelector(".bar").remove(); }
else {
  const qs = location.search ? (APP_URL.includes("?") ? "&" : "?") + location.search.slice(1) : "";
  fr.src = APP_URL + qs; fr.onload = listo; setTimeout(listo, 12000);
}
/* La app avisa cuando hay una versión nueva publicada: se recarga sola */
addEventListener("message", e => { if (e.data && e.data.epp === "reload") { msg && (msg.textContent = "Actualizando…"); location.reload(); } });
/* Volver a la app desde segundo plano: si pasó mucho rato, se recarga para ver lo último */
let oculto = 0;
document.addEventListener("visibilitychange", () => { if (document.hidden) oculto = Date.now(); else if (oculto && Date.now() - oculto > 30 * 60e3) location.reload(); });

/* Instalar */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const inst = document.getElementById("inst"), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let ev = null; const cerrado = () => { try { return localStorage.getItem("instX") === "1"; } catch (e) { return false; } };
addEventListener("beforeinstallprompt", e => { e.preventDefault(); ev = e; if (!standalone && !cerrado()) inst.style.display = "flex"; });
document.getElementById("inst-ok").onclick = async () => { if (ev) { ev.prompt(); await ev.userChoice; ev = null; } inst.style.display = "none"; };
document.getElementById("inst-x").onclick = () => { inst.style.display = "none"; try { localStorage.setItem("instX", "1"); } catch (e) {} };
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !cerrado()) {
  document.getElementById("inst-t").innerHTML = "Para instalar: toca <b>Compartir</b> ⬆️ y luego <b>Agregar a inicio</b>.";
  document.getElementById("inst-ok").remove(); inst.style.display = "flex";
}
</script>
</body>
</html>
